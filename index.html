<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Slow Gifts</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            background: #0a0a1a;
            color: #ffffff;

            min-height: 100vh;

            padding:
                16px
                16px
                100px
                16px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        /* =========================
           СТРАНИЦЫ
        ========================= */

        .page {
            display: none;
            width: 100%;
        }

        .page.active {
            display: block;
        }

        /* =========================
           ХЕДЕР
        ========================= */

        .header {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                8px
                8px
                16px
                8px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;

            background: #11112a;

            padding: 6px 12px;

            border-radius: 12px;

            white-space: nowrap;

            text-shadow:
                0 0 8px
                rgba(255, 255, 255, 0.25);
        }

        .logo .slow {
            color: #ffffff;
        }

        .logo .gifts {
            color: #9b59b6;

            text-shadow:
                0 0 10px
                rgba(155, 89, 182, 0.65);
        }

        /* =========================
           БАЛАНС
        ========================= */

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }

        .balance {
            height: 40px;

            background: #11112a;

            padding:
                7px
                12px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 600;

            display: flex;
            align-items: center;
            gap: 4px;
        }

        .telegram-star {
            width: 17px;
            height: 17px;
            display: block;
        }

        .plus-button {
            width: 40px;
            height: 40px;

            background: #11112a;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #2f9cff;

            font-size: 27px;
            font-weight: 500;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           БОЛЬШОЙ КВАДРАТ
        ========================= */

        .roulette-box {
            width: 100%;
            height: 150px;

            background: #11112a;

            border-radius: 16px;

            margin-top: 12px;
        }

        /* =========================
           СЕТКА КЕЙСОВ
        ========================= */

        .cases-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 16px;

            padding: 0 4px;
        }

        .case-box {
            width: 100%;
            height: 150px;

            background: #11112a;

            border-radius: 16px;

            overflow: hidden;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .case-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            border-radius: 16px;
        }

        /* Пустой кейс */

        .empty-case {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #777797;

            font-size: 14px;
            font-weight: 600;
        }

        /* =========================
           БОНУСЫ
        ========================= */

        .bonus-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 16px;

            padding: 0 4px;
        }

        .bonus-box {
            width: 100%;
            height: 110px;

            background: #11112a;

            border-radius: 16px;

            overflow: hidden;
        }

        .telegram-bonus {
            display: flex;

            align-items: center;
            justify-content: center;

            padding: 12px;

            text-align: center;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .telegram-bonus:active {
            transform: scale(0.97);
        }

        .telegram-bonus-text {
            font-size: 14px;
            line-height: 1.25;

            font-weight: 800;

            color: #ffffff;
        }

        /* =========================
           ПРОФИЛЬ
        ========================= */

        .profile-box {
            width: 100%;
            height: 190px;

            background: #11112a;

            border-radius: 16px;

            margin-top: 12px;

            position: relative;

            display: flex;
            align-items: flex-start;
        }

        .profile-user {
            display: flex;
            align-items: center;

            margin-left: 16px;
            margin-top: 16px;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;

            border-radius: 50%;

            background: #1b1b38;

            border:
                2px solid
                rgba(255, 255, 255, 0.08);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            flex-shrink: 0;

            font-size: 32px;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .profile-username {
            margin-left: 8px;

            font-size: 18px;
            font-weight: 900;

            color: #ffffff;

            max-width: 200px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .profile-small-box {
            position: absolute;

            left: 16px;
            bottom: 16px;

            width: 72px;
            height: 72px;

            background: #1b1b38;

            border-radius: 14px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: space-between;

            padding:
                8px
                5px
                7px
                5px;
        }

        .days-title {
            font-size: 13px;
            font-weight: 700;

            color: #ffffff;
        }

        .days-count {
            font-size: 20px;
            font-weight: 800;

            color: #ffffff;
        }

        /* =========================
           NFT
        ========================= */

        .profile-nft-box {
            width: calc(100% - 16px);

            min-height: 180px;

            background: #11112a;

            border-radius: 16px;

            margin:
                16px
                auto
                0
                auto;

            padding: 16px;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .no-nft-text {
            font-size: 15px;

            font-weight: 600;

            color: #777797;

            text-align: center;
        }

        /* =========================
           НИЖНЯЯ НАВИГАЦИЯ
        ========================= */

        .bottom-nav {
            position: fixed;

            bottom: 10px;

            left: 12px;
            right: 12px;

            height: 76px;

            background:
                rgba(17, 17, 42, 0.96);

            border:
                1px solid
                rgba(255, 255, 255, 0.06);

            border-radius: 22px;

            padding: 6px;

            display: flex;

            align-items: center;
            justify-content: space-around;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.35);

            z-index: 1000;
        }

        .nav-item {
            position: relative;

            width: 25%;
            height: 62px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 2px;

            background: transparent;

            border: none;

            color: #666681;

            font-size: 10px;

            font-weight: 700;

            cursor: pointer;

            border-radius: 17px;

            transition:
                color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;

            -webkit-tap-highlight-color: transparent;
        }

        .nav-item .nav-icon {
            font-size: 25px;

            line-height: 27px;

            filter: grayscale(1);

            opacity: 0.65;

            transition:
                filter 0.2s ease,
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item.active {
            color: #b56cff;

            background:
                rgba(155, 89, 182, 0.15);

            box-shadow:
                0 0 20px
                rgba(155, 89, 182, 0.08);
        }

        .nav-item.active .nav-icon {
            filter: none;

            opacity: 1;

            transform:
                translateY(-1px);

            text-shadow:
                0 0 10px
                rgba(181, 108, 255, 0.7);
        }

        .nav-item.active::before {
            content: "";

            position: absolute;

            top: 0;
            left: 50%;

            transform:
                translateX(-50%);

            width: 24px;
            height: 3px;

            background: #b56cff;

            border-radius:
                0 0 6px 6px;

            box-shadow:
                0 0 10px
                rgba(181, 108, 255, 0.7);
        }

        .nav-item:active {
            transform: scale(0.94);
        }

        /* =========================
           КРАСНАЯ ТОЧКА
        ========================= */

        .badge-dot {
            position: absolute;

            top: 7px;
            right: calc(50% - 20px);

            width: 7px;
            height: 7px;

            background: #ff4444;

            border-radius: 50%;

            border:
                2px solid
                #11112a;
        }
    </style>
</head>
